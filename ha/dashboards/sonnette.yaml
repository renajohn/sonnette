# "Sonnette" (doorbell) dashboard: answers three questions at a glance,
# in the user's own words:
#   1. Did my delivery arrive today?
#   2. Who rang during the day?
#   3. Were there suspicious movements during the night?
#
# Source of truth: ha/dashboards/sonnette.yaml in the repo, deployed by
# deploy/deploy-ha.sh, which replaces the tokens (NAME between double
# underscores) with the values from deploy/deploy.env.
# Do not edit it on the host.
#
# Where the data comes from: ONE entity, sensor.porch_summary, published by
# the doorbell-ai service (doorbell/summary.py) from its JSONL logs, the
# only durable source. Plus the real-time entities of the service (visit,
# person, animal, latest photo). Exception: the journal reads the HISTORY
# of the four sensor.porch_journal_* in the HA recorder, set to 90 days
# for this purpose (HA configuration.yaml, recorder: purge_keep_days).
#
# What the dashboard must NEVER claim (spec section 5):
# - naming someone: the service knows no identity, no count, no direction
#   of travel. "Who rang" = times and photos;
# - "parcel delivered": the signal means "someone is CARRYING a box". A
#   parcel left on the ground is in the camera's blind spot (tested).
#
# Hard-won rules, not to be rediscovered:
# - Photos via the RELATIVE path /sonnette-photos/<photo field of the event>.
#   No host name: the URL follows the origin we came in through, so the
#   thumbnails load just as well at home as from outside.
#   Each HA entry point (Traefik on the local network, "tailscale serve"
#   from outside) mounts this prefix to doorbell-ai:8099 and strips it
#   before forwarding. ADDING AN ENTRY POINT WITHOUT MOUNTING THIS PREFIX
#   ON IT BREAKS THE THUMBNAILS.
#   No copy under /config/www, no bytes in the backup: the photos stay in
#   /media. /media/local/... returns 401 inside a card; /api/image_proxy
#   requires a signed token, so the image entity only shows through a
#   picture-entity card; a symbolic link from /config/www to /media does
#   not work (aiohttp, follow_symlinks=False, never enabled).
#   This server has NO authentication: never expose it through Funnel,
#   nor on an address routable from the Internet.
# - File names are unique and never rewritten: no more need for the ?v=
#   cache-buster of the old dashboard. Put it back if fixed names reappear.
# - HTML (<a target="_blank"><img>) and not markdown for images: a relative
#   markdown link is intercepted by the HA router.
# - An image grid = HTML <table>; markdown images each land on their own
#   line at full width.
# - Literal scalars "|" for multi-line content: ">-" folds the lines and
#   breaks the markdown. Template lines flush left: four leading spaces
#   turn them into a code block.
# - A single third-party card, Chronicle Card (HACS, default store), for
#   the journal: requested on 2026-09-19 ("all events with all the
#   images"). Everything else is native. <ha-alert> and <ha-icon> are the
#   only HA elements allowed in markdown.
# - The numeric_state visibility conditions accept "attribute".
#
# Layout (reviewed on 2026-09-17, "a lot of empty space, questions too much
# at the top level"):
# - The ANSWERS are at the top level, not the questions. A heading says the
#   topic in one word (Aujourd'hui, Journal); the answer sentence is in bold
#   in the card. Never a heading in the form of a question.
# - Three columns that ALWAYS have content: the photo, the answers, the
#   journal. A section that can be empty (no parcel, quiet night) must
#   never be a column on its own: that is what was digging holes.
#   A topic with nothing to show fits in ONE line, without a thumbnail.
# - No full-width banner for three words: over 3 columns, a short alert
#   is an empty strip.
# - A single screen, and the day is changed there (no "day by day" tab,
#   tried then removed on 2026-09-18: "why a new tab?"). The answers, the
#   journal and the badges read sensor.porch_day, the summary computed for
#   input_datetime.sonnette_jour (the service listens on
#   doorbell/porch/day/set). The live photo, the states and the 24 h
#   graph stay those of the present moment. At midnight, the displayed
#   day goes back to today (automation sonnette_jour_minuit).
# - Health and settings are in a second tab: they are checked when
#   something is wrong, not every morning. An error banner still shows up
#   on the main view if the service or the model goes down.
title: Sonnette
views:
- title: Porte d'entrée
  path: porte
  icon: mdi:doorbell-video
  type: sections
  max_columns: 3
  dense_section_placement: true
  badges:
  - type: entity
    entity: binary_sensor.porte_d_entree_ding
    name: Ça sonne !
    icon: mdi:bell-ring
    color: red
    show_name: true
    show_state: false
    show_icon: true
    visibility:
    - condition: state
      entity: binary_sensor.porte_d_entree_ding
      state: 'on'
  - type: entity
    entity: binary_sensor.porch_visit_in_progress
    name: Quelqu'un devant la porte
    icon: mdi:account-eye
    color: amber
    show_name: true
    show_state: false
    show_icon: true
    visibility:
    - condition: state
      entity: binary_sensor.porch_visit_in_progress
      state: 'on'
  - type: entity
    entity: sensor.porch_day
    name: Cartons
    icon: mdi:package-variant-closed
    color: green
    state_content: packets_today_n
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.porch_day
    name: Sonneries
    icon: mdi:bell-ring-outline
    color: red
    state_content: dings_today_n
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.porch_day
    name: Nuit précédente
    icon: mdi:weather-night
    color: deep-purple
    state_content: night_n
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.porch_day
    name: Passages
    icon: mdi:walk
    color: primary
    state_content: visits_today
    show_name: true
    show_state: true
    show_icon: true
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: tile
      entity: script.sonnette_jour_decaler
      name: Jour précédent
      icon: mdi:chevron-left
      hide_state: true
      grid_options:
        columns: 3
      tap_action:
        action: perform-action
        perform_action: script.sonnette_jour_decaler
        data:
          jours: -1
    - type: tile
      entity: input_datetime.sonnette_jour
      name: Jour affiché
      icon: mdi:calendar
      grid_options:
        columns: 4
    - type: tile
      entity: script.sonnette_jour_decaler
      name: Jour suivant
      icon: mdi:chevron-right
      hide_state: true
      grid_options:
        columns: 3
      tap_action:
        action: perform-action
        perform_action: script.sonnette_jour_decaler
        data:
          jours: 1
    - type: tile
      entity: script.sonnette_jour_decaler
      name: Aujourd'hui
      icon: mdi:calendar-today
      hide_state: true
      color: primary
      grid_options:
        columns: 2
      tap_action:
        action: perform-action
        perform_action: script.sonnette_jour_decaler
        data:
          jours: 0
  - type: grid
    cards:
    - type: heading
      heading: Devant la porte
      heading_style: title
      icon: mdi:cctv
    - type: picture-entity
      entity: image.porch_latest_photo
      show_name: false
      show_state: false
    - type: tile
      entity: binary_sensor.porch_visit_in_progress
      name: Visite
      icon: mdi:account-eye
      color: amber
      vertical: true
      grid_options:
        columns: 4
    - type: tile
      entity: binary_sensor.porch_person
      name: Personne
      icon: mdi:account
      color: amber
      vertical: true
      grid_options:
        columns: 4
    - type: tile
      entity: binary_sensor.porch_animal
      name: Animal
      icon: mdi:paw
      color: amber
      vertical: true
      grid_options:
        columns: 4
    - type: markdown
      content: |
        {% set v = state_attr('sensor.porch_summary', 'last_visit') %}
        {% set noms = {'people': 'une personne', 'animal': 'un animal', 'packet': 'un carton'} %}
        {% if v %}Dernier passage **{{ 'aujourd\'hui' if v.day == now().strftime('%d/%m') else 'le ' ~ v.day }} à {{ v.time }}**{% for x in v.subjects if x in noms %}{{ ' — ' if loop.first else ', ' }}{{ noms[x] }}{% endfor %}{% if v.dings %}, a sonné{% endif %}.{% else %}Aucun passage ces 7 derniers jours.{% endif %}
    - type: tile
      entity: script.sonnette_garder
      name: Garder la photo du dernier passage
      icon: mdi:archive-arrow-down-outline
      color: amber
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: script.sonnette_garder
        data:
          quoi: last_visit
  - type: grid
    cards:
    - type: heading
      heading: Ce jour
      heading_style: title
      icon: mdi:calendar-today
      badges:
      - type: entity
        entity: input_datetime.sonnette_jour
        show_state: true
        show_icon: false
    - type: markdown
      content: |
        {% set base = '/sonnette-photos/' %}
        {% set s = 'sensor.porch_day' %}
        {% set jour = states('input_datetime.sonnette_jour') %}
        {% set aujourdhui = jour == now().strftime('%Y-%m-%d') %}
        {% set colis = state_attr(s, 'packets_today') or [] %}
        {% set dings = state_attr(s, 'dings_today') or [] %}
        {% set nuit = state_attr(s, 'night') or [] %}
        {% set dc = state_attr(s, 'last_packet') %}
        {% set dd = state_attr(s, 'last_ding') %}
        {% set nf = (state_attr(s, 'night_from') or '')[6:] %}
        {% set nt = (state_attr(s, 'night_to') or '')[6:] %}
        {% set noms = {'people': 'mdi:account', 'animal': 'mdi:paw', 'packet': 'mdi:package-variant-closed'} %}
        {% if states(s) in ['unavailable', 'unknown'] %}
        <ha-alert alert-type="error" title="Service injoignable">Ces réponses ne sont pas à jour.</ha-alert>
        {% elif not is_state('binary_sensor.porch_model', 'on') %}
        <ha-alert alert-type="error" title="Le service ne classe plus">Les photos sont écrites mais plus analysées : ces réponses sont aveugles.</ha-alert>
        {% elif is_state('binary_sensor.porch_ring_link', 'off') %}
        <ha-alert alert-type="error" title="Ring est muet">ring-mqtt ne donne plus signe de vie : aucune photo n'arrive.</ha-alert>
        {% endif %}
        {% if states(s) not in ['unavailable', 'unknown'] and states(s) != jour %}
        <ha-alert alert-type="info" title="Chargement du {{ jour }}">Un instant.</ha-alert>
        {% endif %}
        {% if colis %}
        <ha-alert alert-type="success" title="Livraison probable à {{ colis | map(attribute='time') | reverse | join(', ') }}">Quelqu'un a été vu avec un carton.</ha-alert>

        <table width="100%"><tr>{% for c in colis[:4] %}<td width="50%"><a href="{{ base }}{{ c.photo }}" target="_blank"><img src="{{ base }}{{ c.photo }}" width="100%"></a></td>{% if loop.index % 2 == 0 and not loop.last %}</tr><tr>{% endif %}{% endfor %}{% if colis[:4] | length % 2 %}<td width="50%"></td>{% endif %}</tr></table>
        {% else %}
        <ha-icon icon="mdi:package-variant-closed"></ha-icon> **Pas de livraison vue.**{% if dc and aujourdhui %} Dernier carton aperçu le {{ dc.day }} à {{ dc.time }}.{% endif %}
        {% endif %}

        {% if dings %}
        <ha-alert alert-type="warning" title="On a sonné à {{ dings | map(attribute='time') | reverse | join(', ') }}"></ha-alert>

        <table width="100%"><tr>{% for d in dings[:4] %}<td width="50%" align="center">{% if d.photo %}<a href="{{ base }}{{ d.photo }}" target="_blank"><img src="{{ base }}{{ d.photo }}" width="100%"></a><br>{% endif %}{{ d.time }}</td>{% if loop.index % 2 == 0 and not loop.last %}</tr><tr>{% endif %}{% endfor %}{% if dings[:4] | length % 2 %}<td width="50%"></td>{% endif %}</tr></table>
        {% else %}
        <ha-icon icon="mdi:bell-off-outline"></ha-icon> **Personne n'a sonné.**{% if dd and aujourdhui %} Dernière sonnerie le {{ dd.day }} à {{ dd.time }}.{% endif %}
        {% endif %}

        {% if nuit %}
        <ha-alert alert-type="warning" title="{{ 'Cette nuit' if aujourdhui else 'La nuit précédente' }} : {{ nuit | length }} passage{{ 's' if nuit | length > 1 else '' }}">{% for v in nuit | reverse %}{{ v.time }} {% for x in v.subjects if x in noms %}<ha-icon icon="{{ noms[x] }}"></ha-icon>{% endfor %}{{ ' · ' if not loop.last else '' }}{% endfor %}</ha-alert>

        <table width="100%"><tr>{% for v in (nuit | selectattr('photos') | list)[:4] %}<td width="50%" align="center"><a href="{{ base }}{{ v.photos[0] }}" target="_blank"><img src="{{ base }}{{ v.photos[0] }}" width="100%"></a><br>{{ v.time }}</td>{% if loop.index % 2 == 0 and not loop.last %}</tr><tr>{% endif %}{% endfor %}</tr></table>
        {% else %}
        <ha-icon icon="mdi:weather-night"></ha-icon> **{{ 'Nuit calme' if aujourdhui else 'Nuit précédente calme' }}** — aucun passage entre {{ nf }} et {{ nt }}.
        {% endif %}
    - type: tile
      entity: script.sonnette_garder
      name: Garder la photo de sonnerie
      icon: mdi:archive-arrow-down-outline
      color: red
      hide_state: true
      grid_options:
        columns: 6
      tap_action:
        action: perform-action
        perform_action: script.sonnette_garder
        data:
          quoi: last_ding
      visibility:
      - condition: numeric_state
        entity: sensor.porch_summary
        attribute: dings_7d
        above: 0
    - type: tile
      entity: script.sonnette_garder
      name: Garder la photo du carton
      icon: mdi:archive-arrow-down-outline
      color: green
      hide_state: true
      grid_options:
        columns: 6
      tap_action:
        action: perform-action
        perform_action: script.sonnette_garder
        data:
          quoi: last_packet
      visibility:
      - condition: numeric_state
        entity: sensor.porch_summary
        attribute: packets_7d
        above: 0
    - type: markdown
      content: |
        <ha-icon icon="mdi:information-outline"></ha-icon> *« Vu avec un carton » n'est pas « colis déposé » : un colis posé au sol est dans l'angle mort de la caméra. Le système ne reconnaît personne : il donne des heures et des photos.*
  - type: grid
    cards:
    - type: heading
      heading: Journal
      heading_style: title
      icon: mdi:timeline-clock-outline
    # Chronicle Card (HACS): one line per kept photo, read from the
    # HISTORY of four sensors of the service (sensor.porch_journal_*),
    # whose state is the time to the second and whose photo attribute is
    # the relative path. The title of a line = entity name + state:
    # "Personne 07:46:15". The card skips unknown/unavailable states AND
    # the transition out of them: that is why these sensors are retained
    # and have no availability (publisher.py). The day selector above
    # does not drive this card: it shows days_back days, grouped by date,
    # and the recorder keeps them 90 days (configuration.yaml).
    # The "Photo" buttons open the full image in a new tab: an ABSOLUTE
    # URL is mandatory here (a relative path would be taken for a HA
    # page), hence one button per entry point.
    - type: custom:chronicle-card
      show_header: false
      layout: vertical
      days_back: 90
      max_events: 2000
      time_format: 24h
      language: fr
      appearance:
        card_height: 780px
        show_images: true
        show_icons: true
        show_severity_badge: false
        show_source_badge: false
        show_category: false
        animate_new_events: true
      grouping:
        enabled: false
      sources:
      - type: history
        name: Journal
        entities:
        - sensor.porch_journal_personne
        - sensor.porch_journal_animal
        - sensor.porch_journal_carton
        - sensor.porch_journal_sonnerie
        image_template: "{% if attributes.photo %}/sonnette-photos/{{ attributes.photo }}{% endif %}"
        entity_config:
          sensor.porch_journal_personne:
            name: Personne
            icon: mdi:account
            color: "#e6a100"
          sensor.porch_journal_animal:
            name: Animal
            icon: mdi:paw
            color: "#2e9e5b"
          sensor.porch_journal_carton:
            name: Carton
            icon: mdi:package-variant-closed
            color: "#8b5a2b"
          sensor.porch_journal_sonnerie:
            name: Sonnerie
            icon: mdi:bell-ring
            color: "#d93025"
        actions:
        - label: Photo (maison)
          icon: mdi:home
          type: navigate
          url: __HA_URL_LAN__{media_url}
        - label: Photo (dehors)
          icon: mdi:earth
          type: navigate
          url: __HA_URL_REMOTE__{media_url}
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: 24 heures
      heading_style: subtitle
      icon: mdi:chart-timeline
    - type: history-graph
      hours_to_show: 24
      grid_options:
        columns: full
      entities:
      - entity: binary_sensor.porch_person
        name: Personne
      - entity: binary_sensor.porch_animal
        name: Animal
      - entity: binary_sensor.porte_d_entree_ding
        name: Sonnerie
      - entity: binary_sensor.porte_d_entree_motion
        name: Mouvement
  - type: grid
    cards:
    - type: heading
      heading: 7 jours
      heading_style: subtitle
      icon: mdi:chart-box-outline
    - type: tile
      entity: sensor.porch_summary
      name: Passages
      icon: mdi:walk
      state_content: visits_7d
      color: blue
      tap_action:
        action: none
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.porch_summary
      name: Sonneries
      icon: mdi:bell-ring-outline
      state_content: dings_7d
      color: red
      tap_action:
        action: none
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.porch_summary
      name: Cartons
      icon: mdi:package-variant-closed
      state_content: packets_7d
      color: green
      tap_action:
        action: none
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.porch_summary
      name: Heure de pointe
      icon: mdi:clock-outline
      state_content: peak_hour
      color: purple
      tap_action:
        action: none
      grid_options:
        columns: 6
- title: Santé et réglages
  path: sante
  icon: mdi:heart-pulse
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Santé
      heading_style: title
      icon: mdi:heart-pulse
    - type: tile
      entity: binary_sensor.porch_model
      name: Le service sait classer
      icon: mdi:brain
      color: green
    - type: tile
      entity: binary_sensor.porch_ring_link
      name: ring-mqtt est vivant
      icon: mdi:access-point
      color: green
    - type: tile
      entity: sensor.porte_d_entree_wireless
      name: Signal Wi-Fi de la sonnette
      icon: mdi:wifi
    - type: entities
      entities:
      - entity: sensor.porch_summary
        name: Résumé mis à jour
        icon: mdi:database-clock-outline
        secondary_info: last-updated
      - entity: sensor.porch_summary
        type: attribute
        attribute: archived
        name: Photos gardées (hors purge)
        icon: mdi:archive-outline
  - type: grid
    cards:
    - type: heading
      heading: Réglages
      heading_style: title
      icon: mdi:tune
    - type: tile
      entity: switch.porte_d_entree_motion_detection
      name: Détection de mouvement
      icon: mdi:motion-sensor
      features:
      - type: toggle
    - type: entities
      entities:
      - entity: input_number.sonnette_colis_delai
        name: Attente d'une sonnerie après un colis
      - entity: input_number.sonnette_silence_max
        name: Silence toléré avant alerte
    - type: markdown
      content: |
        Les photos sont purgées après 180 jours, sauf celles que vous gardez. Ne jamais activer le flux vidéo en direct de la sonnette : cela supprime les alertes de mouvement, application Ring comprise.
