# Portainer stack of the doorbell-ai service, deployable as is from this Git
# repository: Portainer > Stacks > Add stack > Repository, compose path
# "docker-compose.yml", and these environment variables in the stack:
#   SERVICE_HOME     service folder on the host; $SERVICE_HOME/data holds
#                    config.yaml (template: service/config.example.yaml), the
#                    SQLite registry and the JSONL journals
#   PHOTOS_HOST_DIR  photos folder on the host, to be placed UNDER the Home
#                    Assistant media folder, in a subfolder of its own:
#                    never shared with another program that would write
#                    there, two writers would compute the same file name
#   PHOTOS_HOST      host name of the photo server (Traefik route)
#   TZ               time zone (Europe/Zurich by default)
# The image is built and published by the GitHub action
# (.github/workflows/image.yml) on every push to main that touches service/.
# Portainer's automatic update pulls before it deploys, so a "build:" here
# would not be enough: its update job fails on an image that exists only
# locally. Redeploy = Portainer's poll (5 min), "Pull and redeploy" in
# Portainer, or deploy/deploy-service.sh, which first checks that no photo
# is arriving right now.
networks:
  web:
    external: true

services:
  doorbell-ai:
    # The tag MUST be the version in service/pyproject.toml: deploy-service.sh
    # refuses otherwise. Change both together, in the same commit: the action
    # publishes the tag, Portainer pulls it.
    image: ghcr.io/renajohn/sonnette:0.3.1
    container_name: doorbell-ai
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Zurich}
    volumes:
      - ${SERVICE_HOME:?service folder on the host}/data:/data
      - ${PHOTOS_HOST_DIR:?photos folder on the host}:/photos
    logging:
      options: { max-size: "10m", max-file: "3" }
    # On the "web" network, routed by Traefik like every HTTP service of
    # the host. No published port: it is reached through Traefik only.
    networks:
      - web
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.http.routers.sonnette.rule: "Host(`${PHOTOS_HOST:?host name of the photo server}`)"
      traefik.http.routers.sonnette.entrypoints: "websecure"
      traefik.http.routers.sonnette.tls: "true"
      # The port is also in the Dockerfile (EXPOSE) and in serve_port of
      # config.yaml: change all three together.
      traefik.http.services.sonnette.loadbalancer.server.port: "8099"
      homepage.name: "Sonnette"
      homepage.description: "Photos de la sonnette d'entrée, classées à l'arrivée"
      homepage.group: "Apps"
      homepage.href: "https://${PHOTOS_HOST}"
      homepage.icon: "mdi-doorbell-video"
      # SECURITY: this server has no authentication, same as Home Assistant's
      # own /local. What makes that acceptable is that PHOTOS_HOST resolves
      # to a PRIVATE address, unreachable from the Internet. Re-check that
      # fact before widening anything: if this address ever became routable
      # from the Internet, the whole history of faces at the door would
      # become public.
      # Also note (reviewed): directory listing is disabled (webserve.py's
      # list_directory returns 404), on purpose and not merely as a detail
      # of this same exposure -- being able to fetch one named photo and
      # being able to browse the whole visit history at a glance are
      # different amounts of harm, and the dashboard never needed the
      # latter (every event carries the exact relative path of its photo).
